name: GUMFALL Foundation Static CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gumfall-foundation-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: gumfall-foundation-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production foundation
        shell: pwsh
        run: ./tools/Test-Production-Foundation.ps1 -Root $PWD

      - name: Validate engine evaluation evidence
        shell: pwsh
        run: ./tools/Test-EngineEvaluationEvidence.ps1 -Root $PWD

      - name: Self-test determinism trace tooling
        shell: pwsh
        run: ./tools/Test-EngineEvaluationDeterminismTraceTool.ps1 -Root $PWD

      - name: Self-test Body Integrity timing tooling
        shell: pwsh
        run: ./tools/Test-EngineEvaluationBodyIntegrityTimingTool.ps1 -Root $PWD

      - name: Validate Git whitespace
        run: git diff --check
