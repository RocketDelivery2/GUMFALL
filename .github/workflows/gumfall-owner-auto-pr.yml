name: GUMFALL Owner Auto PR

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gumfall-owner-auto-pr-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  create-pr:
    name: gumfall-owner-auto-pr
    if: >-
      github.actor == 'RocketDelivery2' &&
      (
        startsWith(github.ref_name, 'design/') ||
        startsWith(github.ref_name, 'docs/') ||
        startsWith(github.ref_name, 'fix/') ||
        startsWith(github.ref_name, 'feat/') ||
        startsWith(github.ref_name, 'foundation/') ||
        startsWith(github.ref_name, 'automation/') ||
        startsWith(github.ref_name, 'ci/') ||
        startsWith(github.ref_name, 'test/') ||
        startsWith(github.ref_name, 'chore/') ||
        startsWith(github.ref_name, 'tools/') ||
        startsWith(github.ref_name, 'schema/')
      )
    runs-on: ubuntu-latest

    steps:
      - name: Create pull request when eligible
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');

            if (branch.startsWith('manual/')) {
              core.notice(`Branch ${branch} is manual-only; no PR created.`);
              return;
            }

            const commit = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: context.sha
            });

            const message = commit.data.commit.message || '';
            const firstLine = message.split('\n')[0].trim();

            if (/\[manual\]/i.test(firstLine)) {
              core.notice('Latest commit opted out with [manual].');
              return;
            }

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              base: 'main',
              per_page: 10
            });

            if (existing.data.length > 0) {
              core.notice(`Open PR already exists: #${existing.data[0].number}`);
              return;
            }

            const compare = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `main...${branch}`
            });

            if ((compare.data.ahead_by || 0) < 1) {
              core.notice(`Branch ${branch} has no commits ahead of main.`);
              return;
            }

            const title = firstLine || `Automated PR for ${branch}`;
            const body = [
              '## Automated owner pull request',
              '',
              `- Branch: \`${branch}\``,
              `- Head SHA: \`${context.sha}\``,
              '- Base: `main`',
              '- Created automatically after an owner push',
              '',
              '## Required validation',
              '',
              '- documentation/schema validation',
              '- production-foundation validation',
              '- engine-evaluation evidence validation',
              '- determinism trace tooling self-test',
              '- Body Integrity timing tooling self-test',
              '- whitespace validation',
              '',
              'Automatic squash merge requires the exact tested head SHA to remain unchanged.',
              'Use `[manual]` or `manual-merge` only when a human-only merge is intentionally required.'
            ].join('\n');

            const created = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: branch,
              base: 'main',
              body,
              draft: false,
              maintainer_can_modify: true
            });

            core.notice(`Created PR #${created.data.number}: ${created.data.html_url}`);
