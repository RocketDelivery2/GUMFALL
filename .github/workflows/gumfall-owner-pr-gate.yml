name: GUMFALL Owner PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: gumfall-owner-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: gumfall-owner-pr-gate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'RocketDelivery2'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout proposed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate documentation and schemas
        shell: pwsh
        run: pwsh tools/Validate-Docs.ps1

      - name: Validate production foundation
        shell: pwsh
        run: pwsh tools/Test-Production-Foundation.ps1 -Root $PWD

      - name: Validate engine evaluation evidence
        shell: pwsh
        run: pwsh tools/Test-EngineEvaluationEvidence.ps1 -Root $PWD

      - name: Self-test determinism trace tooling
        shell: pwsh
        run: pwsh tools/Test-EngineEvaluationDeterminismTraceTool.ps1 -Root $PWD

      - name: Self-test Body Integrity timing tooling
        shell: pwsh
        run: pwsh tools/Test-EngineEvaluationBodyIntegrityTimingTool.ps1 -Root $PWD

      - name: Self-test Prototype 3/4 PASS evidence contracts
        shell: pwsh
        run: ./tools/Test-EngineEvaluationPassContractTool.ps1 -Root $PWD

      - name: Self-test Prototype 3 frame timing tooling
        shell: pwsh
        run: ./tools/Test-EngineEvaluationFrameTimingTool.ps1 -Root $PWD

      - name: Self-test Prototype 4 reconciliation tooling
        shell: pwsh
        run: ./tools/Test-EngineEvaluationReconciliationTool.ps1 -Root $PWD

      - name: Self-test engine candidate discovery
        shell: pwsh
        run: ./tools/Test-EngineEvaluationCandidateDiscoveryTool.ps1 -Root $PWD

      - name: Self-test engine evidence JSON classification
        shell: pwsh
        run: ./tools/Test-EngineEvaluationEvidenceClassification.ps1 -Root $PWD

      - name: Validate whitespace
        shell: bash
        run: git diff --check
